[build]
builder = "NIXPACKS"
buildCommand = "bash ./scripts/railway-build.sh"

[deploy]
# Usa solo il processo web (Next.js)
# Il processo IRC va su un servizio separato
startCommand = "bash ./scripts/railway-start.sh"
preDeployCommand = "bash ./scripts/railway-predeploy.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Railway assegnerà automaticamente $PORT per Next.js (es: 3000)
# NON impostare PORT=6667 nelle variabili d'ambiente!
